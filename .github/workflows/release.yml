name: Build Release Zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=${{ inputs.tag_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-release.txt
          .\.venv\Scripts\python.exe -m pip install pip-audit

      - name: Audit Python dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip_audit -r requirements-release.txt

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -B -m unittest discover -s tests -v

      - name: Build offline zip
        shell: pwsh
        run: |
          .\packaging\Build-MinimalOffline.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = "dist\CaptureBridge_Hub_Minimal_Offline.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Release zip was not created: $zipPath"
          }
          $checksumPath = "$zipPath.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$hash  CaptureBridge_Hub_Minimal_Offline.zip" | Set-Content -NoNewline -Encoding ascii $checksumPath

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title $env:RELEASE_TAG --notes-file RELEASE_NOTES.md
          }

          gh release upload $env:RELEASE_TAG $zipPath $checksumPath --clobber
